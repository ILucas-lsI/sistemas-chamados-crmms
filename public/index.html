<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Chamados - TI Interno</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Sistema de Chamados - TI Interno</h1>
    </header>

    <div class="form-wrapper">
      <form id="chamado-form">
        <div class="form-group">
          <label for="nome">Nome do solicitante:</label>
          <input type="text" id="nome" placeholder="Seu nome completo" required />
        </div>

        <div class="form-group">
          <label for="email">E-mail:</label>
          <input type="email" id="email" placeholder="exemplo@empresa.com" required />
        </div>

        <div class="form-group">
          <label for="departamento">Departamento:</label>
          <input type="text" id="departamento" placeholder="Ex: Suporte, RH, Financeiro" required />
        </div>

        <div class="form-group">
          <label for="descricao">Descrição do problema:</label>
          <textarea id="descricao" placeholder="Descreva o problema com detalhes..." required></textarea>
        </div>

        <div class="form-group">
          <label for="prioridade">Prioridade:</label>
          <select id="prioridade" required>
            <option value="">Selecione...</option>
            <option value="Alta">Alta 🔴</option>
            <option value="Média">Média 🟡</option>
            <option value="Baixa">Baixa 🟢</option>
          </select>
        </div>

        <div class="form-group button-group">
          <button type="submit" class="enviar-btn">Enviar Chamado</button>
        </div>

        <p id="mensagem"></p>
      </form>
    </div>
  </div>

  <script type="module">
    import { db } from "./firebase-config.js";
    import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const form = document.getElementById("chamado-form");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const nomeUsuario = document.getElementById("nome").value;
      const email = document.getElementById("email").value;
      const departamento = document.getElementById("departamento").value;
      const descricao = document.getElementById("descricao").value;
      const prioridade = document.getElementById("prioridade").value;

      try {
        await addDoc(collection(db, "chamados"), {
          nomeUsuario,
          email,
          departamento,
          descricao,
          prioridade,
          status: "Pendente",
          criadoEm: serverTimestamp()
        });

        alert("Chamado enviado com sucesso!");
        form.reset();
      } catch (error) {
        console.error("Erro ao enviar chamado:", error);
        alert("Erro ao enviar o chamado. Verifique o console.");
      }
    });
  </script>
</body>
</html>
