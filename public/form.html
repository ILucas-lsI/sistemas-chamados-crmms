<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abrir Chamado - Sistema de TI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Abrir Chamado - TI Interno</h1>
      <button id="logoutbtn" class="btn-logout">Sair</button>
    </header>

    <div class="form-wrapper">
      <form id="chamado-form">
        <div class="form-group">
          <label for="nome">Nome do solicitante:</label>
          <input type="text" id="nome" required />
        </div>

        <div class="form-group">
          <label for="email">E-mail:</label>
          <input type="email" id="email" required />
        </div>

        <div class="form-group">
          <label for="departamento">Departamento:</label>
          <input type="text" id="departamento" required />
        </div>

        <div class="form-group">
          <label for="descricao">Descrição do problema:</label>
          <textarea id="descricao" required></textarea>
        </div>

        <!--
        <div class="form-group">
          <label for="imagem">Anexar imagem (opcional):</label>
          <input type="file" id="imagem" accept="image/*">
        </div>
        -->

        <div class="form-group">
          <label for="prioridade">Prioridade:</label>
          <select id="prioridade" required>
            <option value="">Selecione...</option>
            <option value="Alta">Alta 🔴</option>
            <option value="Média">Média 🟡</option>
            <option value="Baixa">Baixa 🟢</option>
          </select>
        </div>

        <div class="form-group button-group">
          <button type="submit" class="enviar-btn">Enviar Chamado</button>
        </div>
      </form>
      <p id="mensagem"></p>
    </div>
    <!-- CHAMADOS DO USUÁRIO -->
    <section id="meus-chamados" class="meus-chamados">
      <h2>📋 Meus Chamados</h2>
      <ul id="lista-meus-chamados">
        <li>Carregando seus chamados...</li>
      </ul>
    </section>
  </div>
  <script type="module" src="form.js"></script>
</body>
</html>
